name: Responsive visual audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/responsive_visual_audit.mjs'
      - '.github/workflows/responsive-visual-audit.yml'
      - 'assets/*.css'
      - 'ar/**'
      - 'en/**'
  pull_request:
    paths:
      - 'scripts/responsive_visual_audit.mjs'
      - '.github/workflows/responsive-visual-audit.yml'
      - 'assets/custom-v12.css'
      - 'assets/style.css'
      - 'assets/homepage-combined.css'
      - 'ar/*.html'
      - 'en/*.html'
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          sleep 2
      - name: Capture bilingual desktop/mobile screenshots and detect layout issues
        run: node scripts/responsive_visual_audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilingual-responsive-screenshots
          path: responsive-results/
          if-no-files-found: ignore
          retention-days: 14
