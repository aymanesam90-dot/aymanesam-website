name: Mobile Lighthouse performance audit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'en/index.html'
      - 'ar/index.html'
      - 'assets/homepage-combined.css'
      - '.github/workflows/mobile-lighthouse.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Lighthouse
        run: npm install --no-save lighthouse@12
      - name: Serve local website
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ayman-site.log 2>&1 &
          sleep 2
      - name: Install stable Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Audit Arabic and English mobile pages
        shell: bash
        run: |
          mkdir -p lighthouse-results
          for lang in en ar; do
            ./node_modules/.bin/lighthouse "http://127.0.0.1:8765/$lang/" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer" \
              --preset=perf \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=390 \
              --screenEmulation.height=844 \
              --screenEmulation.deviceScaleFactor=1 \
              --throttling-method=simulate \
              --output=json --output=html \
              --output-path="lighthouse-results/$lang" \
              --quiet
          done
          node - <<'JS'
          const fs = require('fs');
          for (const lang of ['en', 'ar']) {
            const data = JSON.parse(fs.readFileSync('lighthouse-results/' + lang + '.report.json'));
            const metric = id => data.audits[id]?.displayValue || 'N/A';
            console.log(lang.toUpperCase(), 'Performance', Math.round(data.categories.performance.score * 100),
              'LCP', metric('largest-contentful-paint'),
              'FCP', metric('first-contentful-paint'),
              'CLS', metric('cumulative-layout-shift'));
          }
          JS
      - name: Verify production contains latest hero preload
        id: production-deployment
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          for lang in en ar; do
            html=$(curl -fsSL --max-time 25 --retry 2 "https://aymanesam.com/$lang/" || true)
            if [[ "$html" == *'ayman-hero-mobile.webp'* && "$html" == *'fetchpriority="high"'* ]]; then
              echo "$lang: hero preload priority found on production"
            else
              echo "::warning::$lang production HTML does not yet contain expected hero preload priority"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Audit deployed production site (informational)
        if: steps.production-deployment.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p production-results
          for lang in en ar; do
            echo "Auditing live production: $lang"
            timeout 150 ./node_modules/.bin/lighthouse "https://aymanesam.com/$lang/" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --preset=perf \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=390 \
              --screenEmulation.height=844 \
              --screenEmulation.deviceScaleFactor=1 \
              --throttling-method=simulate \
              --output=json --output=html \
              --output-path="production-results/$lang" \
              --quiet || echo "Production audit unavailable: $lang"
          done
          node - <<'JS'
          const fs = require('fs');
          for (const lang of ['en', 'ar']) {
            const path = 'production-results/' + lang + '.report.json';
            if (!fs.existsSync(path)) { console.log(lang, 'live audit unavailable'); continue; }
            const data = JSON.parse(fs.readFileSync(path));
            const score = data.categories?.performance?.score;
            console.log(lang, 'LIVE performance', score == null ? 'N/A' : Math.round(score * 100),
              'LCP', data.audits['largest-contentful-paint']?.displayValue,
              'FCP', data.audits['first-contentful-paint']?.displayValue);
          }
          JS
      - name: Publish bilingual Lighthouse summary
        if: always()
        shell: bash
        run: |
          node - <<'JS'
          const fs = require('fs');
          const rows = [];
          for (const [label, dir] of [['Local', 'lighthouse-results'], ['Production', 'production-results']]) {
            for (const lang of ['ar', 'en']) {
              const path = dir + '/' + lang + '.report.json';
              if (!fs.existsSync(path)) {
                rows.push('| ' + label + ' | ' + lang.toUpperCase() + ' | Not available | — | — | — |');
                continue;
              }
              const data = JSON.parse(fs.readFileSync(path, 'utf8'));
              const value = id => {
                const n = data.audits?.[id]?.numericValue;
                return typeof n === 'number' ? (n / (id === 'cumulative-layout-shift' ? 1 : 1000)).toFixed(id === 'cumulative-layout-shift' ? 3 : 2) : '—';
              };
              const score = data.categories?.performance?.score;
              rows.push('| ' + label + ' | ' + lang.toUpperCase() + ' | ' +
                (typeof score === 'number' ? Math.round(score * 100) : '—') + ' | ' +
                value('largest-contentful-paint') + ' | ' +
                value('first-contentful-paint') + ' | ' +
                value('cumulative-layout-shift') + ' |');
            }
          }
          const summary = [
            '## Mobile Lighthouse — Arabic & English',
            '',
            '| Environment | Language | Performance / 100 | LCP (s) | FCP (s) | CLS |',
            '|---|---|---:|---:|---:|---:|',
            ...rows,
            '',
            'Production results are only collected when the deployed hero preload marker is detected. Lab scores vary between runs.',
            ''
          ].join(String.fromCharCode(10));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-mobile-lighthouse-audits
          path: production-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-lighthouse-audits
          path: lighthouse-results/
          if-no-files-found: ignore
