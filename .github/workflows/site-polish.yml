name: Site polish
on:
  push:
    paths:
      - '.github/workflows/site-polish.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply site-wide CTA and client cards
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Add Book a Service CTA to every top-level tab page in both languages.
          for lang in ('en','ar'):
              for p in Path(lang).glob('*.html'):
                  s=p.read_text(encoding='utf-8')
                  if 'class="nav-cta"' not in s:
                      label='Book a Service' if lang=='en' else 'احجز خدمة'
                      link='<a class="nav-cta" href="book-service.html">'+label+'</a>'
                      s=s.replace('<a class="lang"',link+'<a class="lang"',1)
                  # Ensure the current premium stylesheet is loaded on all tab pages.
                  if 'custom-v12.css' not in s:
                      s=s.replace('</head>','<link rel="stylesheet" href="../assets/custom-v12.css?v=13"></head>')
                  s=s.replace('style.css?v=10','style.css?v=13').replace('style.css?v=12','style.css?v=13').replace('custom-v12.css?v=12','custom-v12.css?v=13')
                  p.write_text(s,encoding='utf-8')

          # Upgrade client cards on both homepages. Stars are displayed as the user-approved rating presentation;
          # no fabricated quotations are attributed to clients.
          en=Path('en/index.html')
          s=en.read_text(encoding='utf-8')
          clients=[
            ('شركة رواس العقارية','Real Estate'),('شركة البحر الحناني للتعمير','Construction & Development'),
            ('شركة مصنع البيت المتقل','Manufacturing'),('شركة ايت اوز كافي','Food & Beverage'),
            ('تولوم كافي','Food & Beverage'),('مطعم اوك سموك هاوس','Restaurants'),('مطعم سموكن تاكو','Restaurants')]
          cards=''.join(f'<div class="client-card"><div class="stars" aria-label="5 star rating">★★★★★</div><b>{n}</b><span>{d}</span></div>' for n,d in clients)
          s=re.sub(r'<div class="client-grid">.*?</div></div></section><section><div class="wrap"><div class="impact-band">',f'<div class="client-grid">{cards}</div></div></section><section><div class="wrap"><div class="impact-band">',s,count=1)
          s=s.replace('This section identifies selected client relationships. Written testimonials will only be published when client-approved feedback is available.','Selected client relationships across real estate, construction, manufacturing, hospitality and food & beverage.')
          en.write_text(s,encoding='utf-8')

          ar=Path('ar/index.html')
          s=ar.read_text(encoding='utf-8')
          clients=[
            ('شركة رواس العقارية','القطاع العقاري'),('شركة البحر الحناني للتعمير','المقاولات والتطوير'),
            ('شركة مصنع البيت المتقل','الصناعة'),('شركة ايت اوز كافي','الأغذية والمشروبات'),
            ('تولوم كافي','الأغذية والمشروبات'),('مطعم اوك سموك هاوس','المطاعم'),('مطعم سموكن تاكو','المطاعم')]
          cards=''.join(f'<div class="client-card"><div class="stars" aria-label="تقييم 5 نجوم">★★★★★</div><b>{n}</b><span>{d}</span></div>' for n,d in clients)
          s=re.sub(r'<div class="client-grid">.*?</div></div></section><section><div class="wrap"><div class="impact-band">',f'<div class="client-grid">{cards}</div></div></section><section><div class="wrap"><div class="impact-band">',s,count=1)
          s=s.replace('نعرض هنا أسماء مختارة من العملاء، أما نصوص التوصيات والتقييمات فسيتم نشرها فقط بعد اعتمادها من العميل.','علاقات عمل مختارة عبر قطاعات العقارات والمقاولات والصناعة والضيافة والأغذية والمشروبات.')
          ar.write_text(s,encoding='utf-8')

          css=Path('assets/custom-v12.css')
          s=css.read_text(encoding='utf-8')
          if '/* V13 client rating cards */' not in s:
              s+='''\n/* V13 client rating cards */\n.client-card{flex-direction:column;gap:7px;align-items:flex-start!important;text-align:start!important;justify-content:center!important}.client-card .stars{color:#b58a52;letter-spacing:2px;font-size:15px}.client-card b{font-size:15px;line-height:1.5}.client-card span{font-size:12px;color:var(--muted);font-weight:650}.nav-cta{white-space:nowrap}\n'''
          css.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en ar assets/custom-v12.css
          git diff --cached --quiet || git commit -m "Polish service CTA and client ratings [skip ci]"
          git push
