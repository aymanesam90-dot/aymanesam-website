name: Final homepage cleanup
on:
  push:
    paths:
      - '.github/workflows/final-home-cleanup.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove industry section and sync Arabic clients
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Remove Industry Exposure / القطاعات section from both homepages.
          for file, label in [('en/index.html','Industry Exposure'),('ar/index.html','القطاعات')]:
              p=Path(file)
              s=p.read_text(encoding='utf-8')
              pattern=rf'<section><div class="wrap"><div class="eyebrow">{re.escape(label)}</div>.*?</section>'
              s,n=re.subn(pattern,'',s,count=1,flags=re.S)
              if n==0:
                  raise SystemExit(f'Section not found: {label} in {file}')
              p.write_text(s,encoding='utf-8')

          # Keep Arabic client section in sync with the English list (13 companies).
          p=Path('ar/index.html')
          s=p.read_text(encoding='utf-8')
          clients=[
            ('شركة رواس العقارية','القطاع العقاري'),
            ('شركة البحر الحناني للتعمير','المقاولات والتطوير'),
            ('شركة مصنع البيت المتقل','الصناعة'),
            ('شركة ايت اوز كافي','الأغذية والمشروبات'),
            ('تولوم كافي','الأغذية والمشروبات'),
            ('مطعم اوك سموك هاوس','المطاعم'),
            ('مطعم سموكن تاكو','المطاعم'),
            ('عجلات','التجزئة'),
            ('مصنع تصميم المعادن','الصناعة'),
            ('شركة بيفاتيل للاتصالات','الاتصالات'),
            ('شركة حجوزات العالم للسفر والسياحة','السفر والسياحة'),
            ('شركة اكودا لخدمات الأعمال','خدمات الأعمال'),
            ('شركة تكانة لخدمات الهاوس كيبنج','خدمات الهاوس كيبنج'),
          ]
          cards=''.join(f'<div class="client-card"><div class="stars" aria-label="تقييم 5 نجوم">★★★★★</div><b>{name}</b><span>{sector}</span></div>' for name,sector in clients)
          s=re.sub(r'<div class="client-grid">.*?</div></div></section><section id="contact">',f'<div class="client-grid">{cards}</div></div></section><section id="contact">',s,count=1,flags=re.S)
          s=s.replace('علاقات عمل مختارة عبر قطاعات العقارات والمقاولات والصناعة والضيافة والأغذية والمشروبات.','علاقات عمل مختارة عبر قطاعات الاتصالات والسفر والتجزئة والصناعة وخدمات الأعمال والعقارات والمقاولات والضيافة والأغذية والمشروبات.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en/index.html ar/index.html
          git diff --cached --quiet || git commit -m "Remove industry section and sync Arabic client list [skip ci]"
          git push
