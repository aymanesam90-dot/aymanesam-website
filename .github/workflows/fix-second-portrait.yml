name: Fix second portrait edge spacing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-second-portrait.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          css=Path('assets/custom-v12.css')
          s=css.read_text(encoding='utf-8')
          marker='/* FINAL portrait edge fix */'
          block='''\n\n/* FINAL portrait edge fix */\n.executive-panel .portrait-small{width:100%!important;max-width:430px!important;height:500px!important;min-height:500px!important;justify-self:center!important;padding:0!important;margin:0!important;background:transparent!important;overflow:hidden!important;border-radius:28px!important}\n.executive-panel .portrait-small picture{display:block!important;width:100%!important;height:100%!important;margin:0!important;padding:0!important}\n.executive-panel .portrait-small picture img{display:block!important;width:100%!important;height:100%!important;max-height:none!important;object-fit:cover!important;object-position:center 25%!important;margin:0!important;padding:0!important;border:0!important;border-radius:0!important}\n@media(max-width:850px){.executive-panel .portrait-small{max-width:360px!important;height:430px!important;min-height:430px!important;border-radius:24px!important}}\n@media(max-width:560px){.executive-panel .portrait-small{max-width:300px!important;height:360px!important;min-height:360px!important;border-radius:20px!important}}\n'''
          if marker not in s:
              s += block
          css.write_text(s, encoding='utf-8')
          for path in ['en/index.html','ar/index.html']:
              p=Path(path)
              t=p.read_text(encoding='utf-8')
              import re
              t=re.sub(r'custom-v12\.css\?v=\d+', 'custom-v12.css?v=23', t)
              p.write_text(t,encoding='utf-8')
          PY
          git config user.name "aymanesam90-dot"
          git config user.email "ayman.esam90@gmail.com"
          git add assets/custom-v12.css en/index.html ar/index.html
          git commit -m "Remove white portrait edges and refresh homepage styling [skip ci]"
          git push