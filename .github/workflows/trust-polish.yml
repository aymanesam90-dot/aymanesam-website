name: Trust Polish
on:
  push:
    paths:
      - 'tools/trust_polish.py'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run trust polish
        run: python tools/trust_polish.py
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en/index.html ar/index.html assets/custom-v12.css
          git diff --cached --quiet || git commit -m "Polish trust signals and personal brand [skip ci]"
          git push
