name: Seed Insight CMS

on:
  push:
    paths:
      - '.github/workflows/seed-insights-cms.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract article content into JSON
        shell: python
        run: |
          import json, re, html
          from pathlib import Path

          def clean(s):
              return html.unescape(re.sub(r'<[^>]+>','',s)).strip()

          for lang in ('en','ar'):
              out=Path(f'content/insights-{lang}')
              out.mkdir(parents=True,exist_ok=True)
              for p in sorted(Path(f'{lang}/insights').glob('*.html')):
                  t=p.read_text(encoding='utf-8')
                  def grab(pattern,label):
                      m=re.search(pattern,t,re.S)
                      if not m: raise SystemExit(f'{p}: missing {label}')
                      return clean(m.group(1))
                  desc=grab(r'<meta name="description" content="([^"]*)"','description')
                  category=grab(r'<section class="page-hero">.*?<div class="eyebrow">(.*?)</div>','category')
                  title=grab(r'<section class="page-hero">.*?<h1>(.*?)</h1>','title')
                  mm=re.search(r'<section class="page-hero">.*?<div class="article-meta">(.*?)</div>',t,re.S)
                  if mm:
                      meta=clean(mm.group(1))
                  else:
                      meta=grab(r'<section class="page-hero">.*?<h1>.*?</h1><p>(.*?)</p>','meta')
                  m=re.search(r'<article class="wrap article-page"><div class="author-box">.*?</div></div>(.*?)<div class="related-insights">',t,re.S)
                  if not m: raise SystemExit(f'{p}: missing article body')
                  body=m.group(1).strip()
                  data={'slug':p.stem,'category':category,'title':title,'meta':meta,'description':desc,'body':body}
                  (out/f'{p.stem}.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - name: Commit Insight CMS files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/insights-en content/insights-ar
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add structured Insight article content [skip ci]"
          git push
