name: Optimize site images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-site-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Optimize images and markup
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          assets=Path('assets')
          jobs=[
            ('Gemini_Generated_Image_16oe0q16oe0q16oe.jpg','ayman-hero',1400,82,720,78),
            ('Gemini_Generated_Image_qzp1flqzp1flqzp1.jpg','ayman-executive',1400,82,720,78),
          ]
          for src_name,stem,maxw,q,mw,mq in jobs:
              src=assets/src_name
              with Image.open(src) as im:
                  im=im.convert('RGB')
                  ratio=min(1,maxw/im.width)
                  desktop=im.resize((round(im.width*ratio),round(im.height*ratio)),Image.Resampling.LANCZOS) if ratio<1 else im.copy()
                  desktop.save(assets/f'{stem}.jpg','JPEG',quality=q,optimize=True,progressive=True)
                  desktop.save(assets/f'{stem}.webp','WEBP',quality=q,method=6)
                  ratio_m=min(1,mw/im.width)
                  mobile=im.resize((round(im.width*ratio_m),round(im.height*ratio_m)),Image.Resampling.LANCZOS) if ratio_m<1 else im.copy()
                  mobile.save(assets/f'{stem}-mobile.webp','WEBP',quality=mq,method=6)

          # Replace visible image sources with optimized responsive pictures.
          mapping={
            'Gemini_Generated_Image_16oe0q16oe0q16oe.jpg':'ayman-hero',
            'Gemini_Generated_Image_qzp1flqzp1flqzp1.jpg':'ayman-executive',
          }
          img_re=re.compile(r'<img\s+([^>]*?)src="([^\"]+)"([^>]*)>',re.I)
          for root in ('en','ar'):
              for p in Path(root).rglob('*.html'):
                  text=p.read_text(encoding='utf-8')
                  depth=len(p.relative_to(root).parents)-1
                  prefix='../' if depth==0 else '../../'
                  def repl(m):
                      before,src,after=m.group(1),m.group(2),m.group(3)
                      name=src.split('/')[-1]
                      if name not in mapping: return m.group(0)
                      stem=mapping[name]
                      attrs=(before+after).strip()
                      attrs=re.sub(r'\s*(loading|decoding|fetchpriority)="[^"]*"','',attrs)
                      is_hero='hero-img' in text[max(0,m.start()-180):m.start()]
                      perf='fetchpriority="high" decoding="async"' if is_hero else 'loading="lazy" decoding="async"'
                      return f'<picture><source media="(max-width:700px)" srcset="{prefix}assets/{stem}-mobile.webp" type="image/webp"><source srcset="{prefix}assets/{stem}.webp" type="image/webp"><img {attrs} src="{prefix}assets/{stem}.jpg" {perf}></picture>'
                  new=img_re.sub(repl,text)
                  if new!=text: p.write_text(new,encoding='utf-8')

          # Keep social/structured-data image as JPEG, but point it at the optimized hero JPEG.
          for root in ('en','ar'):
              for p in Path(root).rglob('*.html'):
                  text=p.read_text(encoding='utf-8')
                  text=text.replace('https://aymanesam.com/assets/Gemini_Generated_Image_16oe0q16oe0q16oe.jpg','https://aymanesam.com/assets/ayman-hero.jpg')
                  p.write_text(text,encoding='utf-8')
          PY
      - name: Report optimized sizes
        run: ls -lh assets/ayman-hero* assets/ayman-executive*
      - name: Commit optimization
        run: |
          git config user.name "aymanesam90-dot"
          git config user.email "ayman.esam90@gmail.com"
          git add assets en ar
          git commit -m "Optimize responsive images and mobile loading [skip ci]"
          git push
