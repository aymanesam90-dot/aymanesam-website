name: Refresh Arabic homepage hero cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-ar-hero-cache.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ar/index.html')
          t=p.read_text(encoding='utf-8').replace('custom-v12.css?v=21','custom-v12.css?v=22')
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name "aymanesam90-dot"
          git config user.email "ayman.esam90@gmail.com"
          git add ar/index.html
          git commit -m "Refresh Arabic homepage hero styling [skip ci]" || exit 0
          git push