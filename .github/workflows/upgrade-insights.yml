name: Upgrade Insights
on:
  push:
    paths:
      - 'tools/upgrade_insights.py'
      - '.github/workflows/upgrade-insights.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade Insights
        run: python tools/upgrade_insights.py
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en ar assets/custom-v12.css
          git diff --cached --quiet || git commit -m "Upgrade Insights authority, article SEO and conversion [skip ci]"
          git push
