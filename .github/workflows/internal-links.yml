name: Validate internal links
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate links and page anchors
        run: python scripts/check_internal_links.py
