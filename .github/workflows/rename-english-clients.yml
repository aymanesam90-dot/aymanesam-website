name: Rename English clients
on:
  push:
    paths:
      - '.github/workflows/rename-english-clients.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update client names
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('en/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Al Bait Al Motqal Factory','Portable House Factory')
          s=s.replace('Takana Housekeeping Services','Tekanah')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en/index.html
          git diff --cached --quiet || git commit -m "Rename English client names [skip ci]"
          git push