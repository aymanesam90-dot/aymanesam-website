name: Refresh Arabic font CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-arabic-font-css.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force Arabic pages to load latest CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('ar').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              new = re.sub(r'custom-v12\.css\?v=\d+', 'custom-v12.css?v=19', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit Arabic CSS version bump
        run: |
          git config user.name "aymanesam90-dot"
          git config user.email "ayman.esam90@gmail.com"
          git add ar
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Force Arabic pages to load Alexandria font [skip ci]"
            git push
          fi
