name: Production smoke verification
on:
  push:
    branches: [main]
    paths:
      - 'scripts/check_sitemap_local.py'
      - 'scripts/check_production.py'
      - '.github/workflows/production-smoke.yml'
      - 'sitemap.xml'
      - 'en/**'
      - 'ar/**'
      - 'content/home-*.json'
  pull_request:
    paths:
      - 'scripts/check_production.py'
      - 'scripts/check_sitemap_local.py'
      - 'sitemap.xml'
      - 'en/**'
      - 'ar/**'
      - 'content/home-*.json'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'
permissions:
  contents: read
jobs:
  local-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sitemap and bilingual canonicals offline
        run: python3 scripts/check_sitemap_local.py
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify live bilingual pages and SEO endpoints
        run: python3 scripts/check_production.py
      - name: Summarize production verification
        if: always()
        run: |
          echo '## Production smoke verification' >> "$GITHUB_STEP_SUMMARY"
          echo 'Checks live Arabic/English pages, approved homepage metrics, canonicals and sitemap. A failed step means production needs investigation.' >> "$GITHUB_STEP_SUMMARY"
