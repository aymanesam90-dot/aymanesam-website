name: Fix client ratings
on:
  push:
    paths:
      - '.github/workflows/fix-client-ratings.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ratings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          new_en = {'Bahrya Restaurants','Roken Al-Jamal','Al Sawah Pharma','Afaq Al Khaleejia Pharmaceuticals'}
          p=Path('en/index.html'); s=p.read_text(encoding='utf-8')
          def en_card(m):
              card=m.group(0)
              name=re.search(r'<b>(.*?)</b>',card).group(1)
              stars='★★★★☆' if name in new_en else '★★★★★'
              return re.sub(r'<div class="stars">.*?</div>',f'<div class="stars" aria-label="Rating: {4 if name in new_en else 5} out of 5">{stars}</div>',card,1)
          s=re.sub(r'<div class="client-card"><div class="stars".*?</div><b>.*?</b><span>.*?</span></div>',en_card,s)
          p.write_text(s,encoding='utf-8')

          new_ar={'شركة مطاعم بحرية','شركة ركن الجمال','شركة الصواح فارما','شركة أفق الخليجية للأدوية'}
          p=Path('ar/index.html'); s=p.read_text(encoding='utf-8')
          def ar_card(m):
              card=m.group(0)
              name=re.search(r'<b>(.*?)</b>',card).group(1)
              stars='★★★★☆' if name in new_ar else '★★★★★'
              label='تقييم 4 من 5 نجوم' if name in new_ar else 'تقييم 5 من 5 نجوم'
              return re.sub(r'<div class="stars".*?</div>',f'<div class="stars" aria-label="{label}">{stars}</div>',card,1)
          s=re.sub(r'<div class="client-card"><div class="stars".*?</div><b>.*?</b><span>.*?</span></div>',ar_card,s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en/index.html ar/index.html
          git diff --cached --quiet || git commit -m "Correct client ratings to five stars except four new clients"
          git push
