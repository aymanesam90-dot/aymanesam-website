name: Homepage performance safeguards
on:
  pull_request:
    paths:
      - 'en/index.html'
      - 'ar/index.html'
      - 'assets/custom-v12-optimized.css'
      - '.github/workflows/performance-qa.yml'
  workflow_dispatch:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate homepage assets and SEO metadata
        shell: python
        run: |
          from pathlib import Path
          import re
          css = Path("assets/custom-v12-optimized.css")
          assert css.exists(), "Optimized CSS missing"
          assert "@import" not in css.read_text(), "CSS import chain reintroduced"
          for lang in ("en", "ar"):
              html = Path(lang, "index.html").read_text()
              assert f'<html lang="{lang}"' in html, f"Incorrect language: {lang}"
              assert f'href="https://aymanesam.com/{lang}/"' in html, f"Canonical missing: {lang}"
              assert 'custom-v12-base.css?v=1' in html, f"Base CSS missing: {lang}"
              assert 'custom-v12-optimized.css?v=1' in html, f"Optimized CSS missing: {lang}"
              assert 'fonts.gstatic.com' in html and 'fonts.googleapis.com' in html, f"Fonts missing: {lang}"
              assert 'fetchpriority="high"' in html, f"Hero priority missing: {lang}"
              for asset in re.findall(r'(?:href|src)="\.\./assets/([^"]+)"', html):
                  filename = asset.split("?")[0]
                  assert Path("assets", filename).exists(), f"Missing asset {filename} on {lang}"
          print("Homepage CSS, image references, language and canonical checks passed")
