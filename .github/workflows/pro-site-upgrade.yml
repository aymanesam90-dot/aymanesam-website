name: Professional website upgrade
on:
  push:
    paths:
      - '.github/workflows/pro-site-upgrade.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade website
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Favicon + browser identity + cache version + richer footer on all HTML pages
          favicon = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2d302b"/><text x="32" y="39" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" fill="#d4ad74">AE</text></svg>'''
          (root/'assets/favicon.svg').write_text(favicon, encoding='utf-8')

          footer_en = '''<footer class="site-footer"><div class="wrap footer-grid"><div><div class="footer-brand">Ayman Esam</div><p>Group Financial Controller · FP&A · Finance Transformation</p><p>Al Khobar, Saudi Arabia</p></div><div><b>Quick Links</b><a href="about.html">About</a><a href="expertise.html">Expertise</a><a href="experience.html">Experience</a><a href="insights.html">Insights</a></div><div><b>Connect</b><a href="mailto:ayman.esam90@gmail.com">ayman.esam90@gmail.com</a><a href="https://www.linkedin.com/in/aymanisam/" target="_blank" rel="noopener">LinkedIn</a><a href="book-service.html">Book a Service</a></div></div><div class="wrap footer-bottom"><span>© 2026 Ayman Esam</span><span>Finance Leadership · Saudi Arabia</span></div></footer>'''
          footer_ar = '''<footer class="site-footer"><div class="wrap footer-grid"><div><div class="footer-brand">Ayman Esam | أيمن عصام</div><p>مدير رقابة مالية للمجموعة · FP&A · التحول المالي</p><p>الخبر، المملكة العربية السعودية</p></div><div><b>روابط سريعة</b><a href="about.html">نبذة</a><a href="expertise.html">الخبرات</a><a href="experience.html">المسيرة</a><a href="insights.html">المقالات</a></div><div><b>تواصل</b><a href="mailto:ayman.esam90@gmail.com">ayman.esam90@gmail.com</a><a href="https://www.linkedin.com/in/aymanisam/" target="_blank" rel="noopener">LinkedIn</a><a href="book-service.html">احجز خدمة</a></div></div><div class="wrap footer-bottom"><span>© 2026 Ayman Esam</span><span>القيادة المالية · السعودية</span></div></footer>'''

          page_titles_en = {
            'index.html':'Ayman Esam | أيمن عصام',
            'about.html':'About | Ayman Esam | أيمن عصام',
            'expertise.html':'Expertise | Ayman Esam | أيمن عصام',
            'experience.html':'Experience | Ayman Esam | أيمن عصام',
            'education.html':'Education | Ayman Esam | أيمن عصام',
            'certifications.html':'Certifications | Ayman Esam | أيمن عصام',
            'insights.html':'Insights | Ayman Esam | أيمن عصام',
            'contact.html':'Contact | Ayman Esam | أيمن عصام',
            'book-service.html':'Book a Finance Service | Ayman Esam | أيمن عصام',
          }
          page_titles_ar = {
            'index.html':'Ayman Esam | أيمن عصام',
            'about.html':'Ayman Esam | أيمن عصام | نبذة',
            'expertise.html':'Ayman Esam | أيمن عصام | الخبرات',
            'experience.html':'Ayman Esam | أيمن عصام | المسيرة المهنية',
            'education.html':'Ayman Esam | أيمن عصام | التعليم',
            'certifications.html':'Ayman Esam | أيمن عصام | الشهادات',
            'insights.html':'Ayman Esam | أيمن عصام | المقالات',
            'contact.html':'Ayman Esam | أيمن عصام | تواصل',
            'book-service.html':'Ayman Esam | أيمن عصام | احجز خدمة مالية',
          }

          for lang in ['en','ar']:
              for p in (root/lang).rglob('*.html'):
                  s=p.read_text(encoding='utf-8')
                  if 'rel="icon"' not in s:
                      s=s.replace('</title>', '</title><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><meta name="theme-color" content="#2d302b">', 1)
                  s=re.sub(r'custom-v12\.css\?v=\d+', 'custom-v12.css?v=16', s)
                  if p.parent == root/lang:
                      title=(page_titles_en if lang=='en' else page_titles_ar).get(p.name)
                      if title:
                          s=re.sub(r'<title>.*?</title>', f'<title>{title}</title>', s, count=1)
                      s=re.sub(r'<footer.*?</footer>', footer_en if lang=='en' else footer_ar, s, count=1, flags=re.S)
                  else:
                      if 'Ayman Esam | أيمن عصام' not in re.search(r'<title>(.*?)</title>', s, re.S).group(1):
                          s=re.sub(r'<title>(.*?)</title>', r'<title>\1 | Ayman Esam | أيمن عصام</title>', s, count=1)
                  p.write_text(s,encoding='utf-8')

          # 2) About: use current portraits and add executive operating principles
          for lang in ['en','ar']:
              p=root/lang/'about.html'; s=p.read_text(encoding='utf-8')
              s=s.replace('../assets/ayman-2.jpg','../assets/Gemini_Generated_Image_qzp1flqzp1flqzp1.jpg')
              s=s.replace('../assets/ayman-3.jpg','../assets/Gemini_Generated_Image_16oe0q16oe0q16oe.jpg')
              if 'executive-principles' not in s:
                  if lang=='en':
                      block='''<div class="executive-principles"><div class="section-head"><div><div class="eyebrow">How I Work</div><h3>Control, insight and action.</h3></div><p>I focus on finance systems that make performance visible, ownership clear and decisions faster.</p></div><div class="principle-grid"><div class="principle"><b>Reliable Numbers</b><span>Disciplined closing, reconciliations and reporting quality.</span></div><div class="principle"><b>Forward Visibility</b><span>Budgets, forecasts, cash outlook and scenario thinking.</span></div><div class="principle"><b>Commercial Context</b><span>Connecting financial analysis with operations and business drivers.</span></div><div class="principle"><b>Actionable Reporting</b><span>Management information designed to support decisions, not only record history.</span></div></div></div>'''
                  else:
                      block='''<div class="executive-principles"><div class="section-head"><div><div class="eyebrow">منهج العمل</div><h3>رقابة، رؤية، ثم إجراء.</h3></div><p>أركز على أنظمة مالية تجعل الأداء واضحاً، والمسؤولية محددة، والقرار أسرع.</p></div><div class="principle-grid"><div class="principle"><b>أرقام موثوقة</b><span>إقفال منضبط وتسويات وجودة أعلى للتقارير.</span></div><div class="principle"><b>رؤية مستقبلية</b><span>موازنات وتوقعات ورؤية نقدية وتحليل سيناريوهات.</span></div><div class="principle"><b>فهم تجاري</b><span>ربط التحليل المالي بمحركات التشغيل والأعمال.</span></div><div class="principle"><b>تقارير تقود للإجراء</b><span>معلومات إدارية تساعد على القرار ولا تكتفي بتسجيل الماضي.</span></div></div></div>'''
                  s=s.replace('<div class="gallery">', block+'<div class="gallery">',1)
              p.write_text(s,encoding='utf-8')

          # 3) Expertise: add decision-oriented value strip
          for lang in ['en','ar']:
              p=root/lang/'expertise.html'; s=p.read_text(encoding='utf-8')
              if 'expertise-value-strip' not in s:
                  if lang=='en':
                      block='''<div class="expertise-value-strip"><div><b>Plan</b><span>Budgets, forecasts and scenarios</span></div><div><b>Control</b><span>Closing, governance and reporting quality</span></div><div><b>Optimize</b><span>Cash, cost and working capital</span></div><div><b>Transform</b><span>ERP, automation and process redesign</span></div></div>'''
                  else:
                      block='''<div class="expertise-value-strip"><div><b>التخطيط</b><span>الموازنات والتوقعات والسيناريوهات</span></div><div><b>الرقابة</b><span>الإقفال والحوكمة وجودة التقارير</span></div><div><b>التحسين</b><span>النقد والتكاليف ورأس المال العامل</span></div><div><b>التحول</b><span>ERP والأتمتة وإعادة تصميم العمليات</span></div></div>'''
                  s=s.replace('<div class="grid">',block+'<div class="grid">',1)
              p.write_text(s,encoding='utf-8')

          # 4) Experience: strengthen scope presentation without inventing achievements
          for lang in ['en','ar']:
              p=root/lang/'experience.html'; s=p.read_text(encoding='utf-8')
              if 'role-points' not in s:
                  if lang=='en':
                      s=s.replace('finance transformation.</p><div class="company-list">','finance transformation.</p><ul class="role-points"><li>Group planning, reporting and financial control</li><li>Cash-flow visibility and performance management</li><li>Finance process improvement across multiple operating models</li></ul><div class="company-list">',1)
                      s=s.replace('finance process improvement.</p></div></div>','finance process improvement.</p><ul class="role-points"><li>Management reporting and performance analysis</li><li>Budgeting, cash flow and inventory oversight</li><li>Reconciliations and finance process improvement</li></ul></div></div>',1)
                  else:
                      s=s.replace('والتحول المالي.</p><div class="company-list">','والتحول المالي.</p><ul class="role-points"><li>التخطيط والتقارير والرقابة على مستوى المجموعة</li><li>رؤية التدفقات النقدية وإدارة الأداء</li><li>تحسين العمليات المالية عبر نماذج تشغيل متعددة</li></ul><div class="company-list">',1)
                      s=s.replace('وتحسين العمليات المالية.</p></div></div>','وتحسين العمليات المالية.</p><ul class="role-points"><li>التقارير الإدارية وتحليل الأداء</li><li>الموازنات والتدفقات النقدية والإشراف على المخزون</li><li>التسويات وتحسين العمليات المالية</li></ul></div></div>',1)
              p.write_text(s,encoding='utf-8')

          # 5) Book service: remove duplicate nav CTA and improve service-card context
          for lang in ['en','ar']:
              p=root/lang/'book-service.html'; s=p.read_text(encoding='utf-8')
              if lang=='en':
                  s=s.replace('<a class="nav-cta current" href="book-service.html">Book a Service</a><a class="nav-cta" href="book-service.html">Book a Service</a>','<a class="nav-cta current" href="book-service.html">Book a Service</a>')
                  replacements={
                    'FP&A & Management Reporting':'<small>Best for: management teams needing clearer performance visibility</small>',
                    'Cash Flow & Working Capital':'<small>Best for: companies needing stronger liquidity and collection discipline</small>',
                    'Financial Control Review':'<small>Best for: finance teams improving close quality, controls and governance</small>',
                    'Finance Transformation':'<small>Best for: businesses redesigning ERP, workflows and finance automation</small>',
                    'Budgeting & Forecasting':'<small>Best for: teams building a structured planning and forecast cycle</small>',
                    'Executive Finance Advisory':'<small>Best for: owners and executives needing focused financial decision support</small>'}
              else:
                  s=s.replace('<a class="nav-cta current" href="book-service.html">احجز خدمة</a><a class="nav-cta" href="book-service.html">احجز خدمة</a>','<a class="nav-cta current" href="book-service.html">احجز خدمة</a>')
                  replacements={
                    'FP&A والتقارير الإدارية':'<small>مناسبة للإدارة التي تحتاج رؤية أوضح للأداء</small>',
                    'التدفقات النقدية ورأس المال العامل':'<small>مناسبة للشركات التي تحتاج ضبطاً أقوى للسيولة والتحصيل</small>',
                    'مراجعة الرقابة المالية':'<small>مناسبة لفرق المالية التي تطور الإقفال والضوابط والحوكمة</small>',
                    'التحول المالي':'<small>مناسبة للشركات التي تطور ERP وسير العمل والأتمتة</small>',
                    'الموازنات والتوقعات':'<small>مناسبة لبناء دورة تخطيط وتوقعات منظمة</small>',
                    'الاستشارات المالية التنفيذية':'<small>مناسبة للملاك والإدارة التنفيذية لدعم القرارات المالية</small>'}
              for h,sm in replacements.items():
                  pattern=f'<h4>{re.escape(h)}</h4>'
                  s=re.sub(pattern, f'<h4>{h}</h4>{sm}', s, count=1)
              p.write_text(s,encoding='utf-8')

          # 6) Insights: add 3 more professional topics and reading metadata
          enp=root/'en/insights.html'; s=enp.read_text(encoding='utf-8')
          s=s.replace('<div class="article-meta">Financial Planning & Analysis</div>','<div class="article-meta">Financial Planning & Analysis · 5 min read</div>')
          s=s.replace('<div class="article-meta">Treasury & Working Capital</div>','<div class="article-meta">Treasury & Working Capital · 5 min read</div>')
          s=s.replace('<div class="article-meta">ERP · Automation · Process</div>','<div class="article-meta">ERP · Automation · Process · 6 min read</div>')
          if 'budgeting-as-management-system.html' not in s:
              cards='''<a class="article-card" href="insights/budgeting-as-management-system.html"><div class="article-cover"><span>Budgeting</span></div><div class="article-body"><div class="article-meta">Planning · 5 min read</div><h4>Budgeting as a Management System</h4><p>A useful budget connects targets, owners, assumptions and follow-up into one management rhythm.</p><span class="read-more">Read article →</span></div></a><a class="article-card" href="insights/working-capital-discipline.html"><div class="article-cover"><span>Working Capital</span></div><div class="article-body"><div class="article-meta">Cash · 5 min read</div><h4>Working Capital Discipline</h4><p>How receivables, inventory and payables shape cash generation and operational resilience.</p><span class="read-more">Read article →</span></div></a><a class="article-card" href="insights/month-end-close-discipline.html"><div class="article-cover"><span>Financial Control</span></div><div class="article-body"><div class="article-meta">Close & Control · 5 min read</div><h4>A Better Month-End Close</h4><p>Why a disciplined close improves reporting speed, confidence and management decision-making.</p><span class="read-more">Read article →</span></div></a>'''
              s=s.replace('</div><div class="quote-box">',cards+'</div><div class="quote-box">',1)
          enp.write_text(s,encoding='utf-8')

          arp=root/'ar/insights.html'; s=arp.read_text(encoding='utf-8')
          s=s.replace('<div class="article-meta">التخطيط والتحليل المالي</div>','<div class="article-meta">التخطيط والتحليل المالي · 5 دقائق</div>')
          s=s.replace('<div class="article-meta">الخزينة ورأس المال العامل</div>','<div class="article-meta">الخزينة ورأس المال العامل · 5 دقائق</div>')
          s=s.replace('<div class="article-meta">ERP · الأتمتة · العمليات</div>','<div class="article-meta">ERP · الأتمتة · العمليات · 6 دقائق</div>')
          if 'budgeting-as-management-system.html' not in s:
              cards='''<a class="article-card" href="insights/budgeting-as-management-system.html"><div class="article-cover"><span>الموازنات</span></div><div class="article-body"><div class="article-meta">التخطيط · 5 دقائق</div><h4>الموازنة كنظام إداري</h4><p>الموازنة الفعالة تربط الأهداف بالمسؤوليات والافتراضات والمتابعة ضمن إيقاع إداري واحد.</p><span class="read-more">اقرأ المقال ←</span></div></a><a class="article-card" href="insights/working-capital-discipline.html"><div class="article-cover"><span>رأس المال العامل</span></div><div class="article-body"><div class="article-meta">النقد · 5 دقائق</div><h4>الانضباط في رأس المال العامل</h4><p>كيف تؤثر الذمم والمخزون والموردون على توليد النقد والمرونة التشغيلية.</p><span class="read-more">اقرأ المقال ←</span></div></a><a class="article-card" href="insights/month-end-close-discipline.html"><div class="article-cover"><span>الرقابة المالية</span></div><div class="article-body"><div class="article-meta">الإقفال والرقابة · 5 دقائق</div><h4>إقفال شهري أفضل</h4><p>لماذا يرفع الإقفال المنضبط سرعة التقارير والثقة وجودة القرار الإداري.</p><span class="read-more">اقرأ المقال ←</span></div></a>'''
              s=s.replace('</div><div class="quote-box">',cards+'</div><div class="quote-box">',1)
          arp.write_text(s,encoding='utf-8')

          # Create the six new article pages.
          article_specs = [
            ('budgeting-as-management-system.html','Budgeting as a Management System','Budgeting','A budget becomes useful when it is treated as a management system rather than a spreadsheet.','''<h2>Start with the business drivers</h2><p>Revenue, margin, headcount, inventory, collections and investment assumptions should be explicit. This makes the plan easier to challenge and update.</p><h2>Assign ownership</h2><p>Each major assumption should have an owner. Finance coordinates the model, while operating teams remain accountable for the drivers behind the numbers.</p><h2>Connect budget to actual performance</h2><p>A budget only creates value when actual results, variances and updated expectations are reviewed consistently. The goal is not to defend the original plan; it is to improve decisions as conditions change.</p>''',
             'الموازنة كنظام إداري','الموازنات','تصبح الموازنة أكثر فاعلية عندما تُدار كنظام إداري وليس كملف أرقام فقط.','''<h2>ابدأ بمحركات الأعمال</h2><p>يجب أن تكون افتراضات الإيرادات والهوامش والموظفين والمخزون والتحصيل والاستثمار واضحة حتى يسهل مناقشتها وتحديثها.</p><h2>حدد المسؤولية</h2><p>لكل افتراض رئيسي مسؤول واضح. المالية تنسق النموذج، بينما تظل فرق التشغيل مسؤولة عن المحركات الفعلية للأرقام.</p><h2>اربط الموازنة بالأداء الفعلي</h2><p>القيمة الحقيقية تظهر عند مراجعة النتائج والانحرافات والتوقعات المحدثة بصورة منتظمة. الهدف ليس الدفاع عن الخطة الأصلية بل تحسين القرار مع تغير الظروف.</p>'''),
            ('working-capital-discipline.html','Working Capital Discipline','Working Capital','Profit does not automatically become cash. Working capital determines how quickly operating performance turns into liquidity.','''<h2>Receivables</h2><p>Clear credit terms, collection ownership and aging visibility help prevent sales growth from creating cash pressure.</p><h2>Inventory</h2><p>Inventory should support service and sales without locking excessive cash into slow-moving stock.</p><h2>Payables</h2><p>Payment planning should protect supplier relationships while using agreed credit terms efficiently.</p><h2>Manage the cycle together</h2><p>Receivables, inventory and payables should be reviewed as one operating cash cycle rather than three separate accounting balances.</p>''',
             'الانضباط في رأس المال العامل','رأس المال العامل','الربح لا يتحول تلقائياً إلى نقد. رأس المال العامل يحدد سرعة تحول الأداء التشغيلي إلى سيولة.','''<h2>الذمم المدينة</h2><p>وضوح شروط الائتمان ومسؤولية التحصيل وأعمار الديون يقلل من تحول نمو المبيعات إلى ضغط نقدي.</p><h2>المخزون</h2><p>يجب أن يدعم المخزون الخدمة والمبيعات دون تجميد سيولة زائدة في أصناف بطيئة الحركة.</p><h2>الذمم الدائنة</h2><p>تخطيط المدفوعات يحافظ على علاقات الموردين ويستفيد بكفاءة من شروط الائتمان المتفق عليها.</p><h2>أدر الدورة كوحدة واحدة</h2><p>يجب مراجعة العملاء والمخزون والموردين كدورة نقدية تشغيلية واحدة، وليس كأرصدة محاسبية منفصلة.</p>'''),
            ('month-end-close-discipline.html','A Better Month-End Close','Financial Control','A strong close process creates the foundation for reliable reporting, analysis and decision-making.','''<h2>Define a close calendar</h2><p>Tasks, owners, deadlines and dependencies should be visible before the period ends.</p><h2>Reconcile before reporting</h2><p>Bank, receivables, payables, inventory and key balance-sheet accounts should be reconciled before management reporting is finalized.</p><h2>Separate preparation from review</h2><p>Clear preparer and reviewer responsibilities improve control and reduce the risk of unresolved issues passing into reports.</p><h2>Measure close quality</h2><p>Track reporting time, late reconciliations, recurring adjustments and unresolved exceptions. A faster close is valuable only when accuracy remains strong.</p>''',
             'إقفال شهري أفضل','الرقابة المالية','الإقفال القوي هو الأساس الذي تعتمد عليه التقارير والتحليل وجودة القرار.','''<h2>حدد تقويماً للإقفال</h2><p>يجب أن تكون المهام والمسؤوليات والمواعيد والاعتماديات واضحة قبل نهاية الفترة.</p><h2>نفذ التسويات قبل التقارير</h2><p>يجب تسوية البنوك والعملاء والموردين والمخزون والحسابات الرئيسية في الميزانية قبل اعتماد التقارير الإدارية.</p><h2>افصل الإعداد عن المراجعة</h2><p>وضوح مسؤوليات المُعد والمراجع يرفع جودة الرقابة ويقلل مرور المشكلات غير المحلولة إلى التقارير.</p><h2>قِس جودة الإقفال</h2><p>تابع زمن التقارير والتسويات المتأخرة والتعديلات المتكررة والاستثناءات المفتوحة. السرعة مهمة فقط إذا ظلت الدقة قوية.</p>''')
          ]

          nav_en='<nav><div class="nav"><a class="brand" href="../index.html">AYMAN <span>ESAM</span></a><div class="links"><a href="../index.html">Home</a><a href="../about.html">About</a><a href="../expertise.html">Expertise</a><a href="../experience.html">Experience</a><a href="../education.html">Education</a><a href="../certifications.html">Certifications</a><a class="current" href="../insights.html">Insights</a><a href="../contact.html">Contact</a><a class="nav-cta" href="../book-service.html">Book a Service</a></div></div></nav>'
          nav_ar='<nav><div class="nav"><a class="brand" href="../index.html">AYMAN <span>ESAM</span></a><div class="links"><a href="../index.html">الرئيسية</a><a href="../about.html">نبذة</a><a href="../expertise.html">الخبرات</a><a href="../experience.html">المسيرة</a><a href="../education.html">التعليم</a><a href="../certifications.html">الشهادات</a><a class="current" href="../insights.html">المقالات</a><a href="../contact.html">تواصل</a><a class="nav-cta" href="../book-service.html">احجز خدمة</a></div></div></nav>'
          for filename,en_title,en_tag,en_intro,en_body,ar_title,ar_tag,ar_intro,ar_body in article_specs:
              en_html=f'''<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{en_title} | Ayman Esam | أيمن عصام</title><meta name="description" content="{en_intro}"><meta name="robots" content="index,follow"><link rel="canonical" href="https://aymanesam.com/en/insights/{filename}"><link rel="alternate" hreflang="en" href="https://aymanesam.com/en/insights/{filename}"><link rel="alternate" hreflang="ar" href="https://aymanesam.com/ar/insights/{filename}"><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="stylesheet" href="../../assets/style.css?v=14"><link rel="stylesheet" href="../../assets/custom-v12.css?v=16"></head><body>{nav_en}<main><section class="page-hero"><div class="wrap"><div class="eyebrow">{en_tag}</div><h1>{en_title}</h1><p>{en_intro}</p></div></section><div class="page-content"><article class="wrap article-page">{en_body}<div class="article-cta"><b>Need help applying this in your finance function?</b><a class="btn primary" href="../book-service.html">Book a Service</a></div></article></div></main>{footer_en}</body></html>'''
              ar_html=f'''<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ayman Esam | أيمن عصام | {ar_title}</title><meta name="description" content="{ar_intro}"><meta name="robots" content="index,follow"><link rel="canonical" href="https://aymanesam.com/ar/insights/{filename}"><link rel="alternate" hreflang="ar" href="https://aymanesam.com/ar/insights/{filename}"><link rel="alternate" hreflang="en" href="https://aymanesam.com/en/insights/{filename}"><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="stylesheet" href="../../assets/style.css?v=14"><link rel="stylesheet" href="../../assets/custom-v12.css?v=16"></head><body>{nav_ar}<main><section class="page-hero"><div class="wrap"><div class="eyebrow">{ar_tag}</div><h1>{ar_title}</h1><p>{ar_intro}</p></div></section><div class="page-content"><article class="wrap article-page">{ar_body}<div class="article-cta"><b>تحتاج إلى تطبيق ذلك داخل وظيفتك المالية؟</b><a class="btn primary" href="../book-service.html">احجز خدمة</a></div></article></div></main>{footer_ar}</body></html>'''
              (root/'en/insights'/filename).write_text(en_html,encoding='utf-8')
              (root/'ar/insights'/filename).write_text(ar_html,encoding='utf-8')

          # 7-10) Styling, favicon identity, SEO/mobile polish
          cssp=root/'assets/custom-v12.css'; c=cssp.read_text(encoding='utf-8')
          marker='/* V16 professional site upgrade */'
          if marker not in c:
              c += '''\n/* V16 professional site upgrade */\nbody{overflow-x:hidden}.site-footer{background:#252823;color:#d8d4cc;border-top:0;padding:58px 0 22px}.footer-grid{display:grid;grid-template-columns:1.4fr .8fr 1fr;gap:42px}.footer-grid>div{display:flex;flex-direction:column;gap:8px}.footer-brand{font-family:Georgia,'Times New Roman',serif;font-size:27px;color:#fff;font-weight:700}.footer-grid p{margin:0;color:#aaa59d;font-size:13px}.footer-grid b{color:#d7b27b;font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px}.footer-grid a{color:#d8d4cc;font-size:13px}.footer-grid a:hover{color:#fff}.footer-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:38px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#99948d}.executive-principles{margin-top:72px}.principle-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.principle{padding:24px;border:1px solid var(--line);border-radius:20px;background:rgba(255,253,249,.82)}.principle b{display:block;font-size:17px;color:var(--deep);margin-bottom:5px}.principle span{display:block;color:var(--muted);font-size:13px}.expertise-value-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:8px 0 38px}.expertise-value-strip>div{padding:18px;border-radius:16px;background:#2d302b;color:#fff}.expertise-value-strip b{display:block;color:#d7b27b;font-size:15px}.expertise-value-strip span{font-size:12px;color:#d3cec6}.role-points{margin:18px 0 4px;padding-inline-start:20px;color:var(--muted)}.role-points li{margin:5px 0}.booking-card small{display:block;color:var(--accent-dark);font-size:11px;line-height:1.5;font-weight:800;margin:0 0 10px}.article-grid{grid-template-columns:repeat(3,1fr)}.article-cta{margin-top:52px;padding:25px;border:1px solid var(--line);border-radius:20px;background:rgba(181,138,82,.08);display:flex;align-items:center;justify-content:space-between;gap:20px}.article-cta .btn{margin:0}.page-content>.wrap>.grid .card{min-height:220px}.gallery img{object-position:center 24%}.client-carousel-shell{max-width:980px}.client-card{min-height:220px!important}.client-section .client-note{max-width:760px}.page-hero{padding-top:84px}.page-content{padding-top:68px}.nav{max-width:1380px;margin:auto;width:100%}.links a{transition:color .2s,border-color .2s,background .2s}.links a:focus-visible,.btn:focus-visible,.client-arrow:focus-visible{outline:3px solid rgba(181,138,82,.45);outline-offset:2px}@media(max-width:950px){.footer-grid{grid-template-columns:1fr 1fr}.footer-grid>div:first-child{grid-column:1/-1}.principle-grid,.expertise-value-strip{grid-template-columns:1fr 1fr}}@media(max-width:700px){.hero{padding-top:34px}.hero h2{font-size:25px}.hero p{font-size:16px}.stats{margin-bottom:64px}.stat{padding:18px}.page-hero{padding:58px 0 36px}.page-content{padding:48px 0 78px}.page-hero p{font-size:16px}.article-grid{grid-template-columns:1fr!important}.article-card{min-height:0}.article-cover{height:140px}.article-cta{align-items:flex-start;flex-direction:column}.footer-grid{grid-template-columns:1fr}.footer-grid>div:first-child{grid-column:auto}.principle-grid,.expertise-value-strip{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.gallery img{height:420px}.job{grid-template-columns:1fr;gap:10px}.company-list{grid-template-columns:1fr}.client-carousel-shell{padding:0 44px}.client-card{min-height:190px!important}.links{padding-bottom:2px}.links a{min-height:38px;display:flex;align-items:center}}\n'''
          cssp.write_text(c,encoding='utf-8')

          # Sitemap entries for new insights
          sp=root/'sitemap.xml'; sm=sp.read_text(encoding='utf-8')
          for lang in ['en','ar']:
              for fn in ['budgeting-as-management-system.html','working-capital-discipline.html','month-end-close-discipline.html']:
                  url=f'https://aymanesam.com/{lang}/insights/{fn}'
                  if url not in sm:
                      sm=sm.replace('</urlset>',f'<url><loc>{url}</loc><changefreq>monthly</changefreq><priority>0.8</priority></url>\n</urlset>')
          sp.write_text(sm,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add assets/favicon.svg assets/custom-v12.css en ar sitemap.xml
          git diff --cached --quiet || git commit -m "Professional site upgrade across content, SEO and mobile [skip ci]"
          git push
