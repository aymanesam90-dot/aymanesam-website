name: SEO and mobile upgrade
on:
  push:
    paths:
      - '.github/workflows/seo-mobile-upgrade.yml'
      - 'tools/seo_mobile_upgrade.py'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run upgrade script
        run: python tools/seo_mobile_upgrade.py
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en ar assets/custom-v12.css
          git diff --cached --quiet || git commit -m "Complete SEO metadata and mobile navigation upgrade [skip ci]"
          git push
