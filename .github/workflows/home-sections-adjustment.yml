name: Homepage sections adjustment
on:
  push:
    paths:
      - '.github/workflows/home-sections-adjustment.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore industry exposure and remove homepage contact
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          configs = {
            'en/index.html': '<section><div class="wrap"><div class="eyebrow">Industry Exposure</div><h3>Finance experience across diverse business models.</h3><div class="sector-strip seven"><div class="sector">Telecommunications</div><div class="sector">Travel & Tourism</div><div class="sector">Retail</div><div class="sector">Manufacturing</div><div class="sector">Business Services</div><div class="sector">Real Estate</div><div class="sector">Construction</div></div></div></section>',
            'ar/index.html': '<section><div class="wrap"><div class="eyebrow">القطاعات</div><h3>خبرة مالية عبر نماذج أعمال متنوعة.</h3><div class="sector-strip seven"><div class="sector">الاتصالات</div><div class="sector">السفر والسياحة</div><div class="sector">التجزئة</div><div class="sector">الصناعة</div><div class="sector">خدمات الأعمال</div><div class="sector">العقارات</div><div class="sector">المقاولات</div></div></div></section>'
          }
          for file, industry in configs.items():
              p=Path(file)
              s=p.read_text(encoding='utf-8')
              # Put Industry Exposure immediately before client section if not already present.
              if ('Industry Exposure' if file.startswith('en/') else '>القطاعات<') not in s:
                  s=s.replace('<section class="client-section">', industry + '<section class="client-section">', 1)
              # Remove homepage Get In Touch / تواصل معي section, leaving the footer and Contact tab intact.
              s,n=re.subn(r'<section id="contact">.*?</section>(?=</main>)','',s,count=1,flags=re.S)
              if n == 0:
                  raise SystemExit(f'Homepage contact section not found in {file}')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en/index.html ar/index.html
          git diff --cached --quiet || git commit -m "Restore industry exposure and remove homepage contact [skip ci]"
          git push