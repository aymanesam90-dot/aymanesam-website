name: Setup New Article CMS

on:
  push:
    paths:
      - '.github/workflows/setup-new-article-cms.yml'

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable article creation and images
        shell: python
        run: |
          from pathlib import Path
          p=Path('.pages.yml')
          t=p.read_text(encoding='utf-8')
          t=t.replace('operations: {create: false, rename: false, delete: false}', 'operations: {create: true, rename: false, delete: false}')
          t=t.replace('    subfolders: false\n    operations: {create: true, rename: false, delete: false}', '    subfolders: false\n    filename: "{slug}.json"\n    operations: {create: true, rename: false, delete: false}')
          t=t.replace('- {name: slug, label: Slug, type: string, readonly: true}', '- {name: slug, label: Slug, type: string, required: true, pattern: "^[a-z0-9-]+$"}')
          t=t.replace('- {name: slug, label: الرابط, type: string, readonly: true}', '- {name: slug, label: الرابط, type: string, required: true, pattern: "^[a-z0-9-]+$"}')
          en='      - {name: title, label: Article title, type: string}\n'
          if 'label: Article image' not in t:
              t=t.replace(en,en+'      - {name: image, label: Article image, type: image, required: true, options: {path: insights, extensions: [jpg, jpeg, png, webp], rename: safe}}\n',1)
          ar='      - {name: title, label: عنوان المقال, type: string}\n'
          if 'label: صورة المقال' not in t:
              t=t.replace(ar,ar+'      - {name: image, label: صورة المقال, type: image, required: true, options: {path: insights, extensions: [jpg, jpeg, png, webp], rename: safe}}\n',1)
          p.write_text(t,encoding='utf-8')
      - name: Commit configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages.yml
          git commit -m "Enable new articles with images in Pages CMS"
          git push
