name: Client carousel redesign
on:
  push:
    paths:
      - '.github/workflows/client-carousel-redesign.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Redesign clients section
        run: |
          python - <<'PY'
          from pathlib import Path

          for f in ['en/index.html','ar/index.html']:
              p=Path(f)
              s=p.read_text(encoding='utf-8')
              if 'client-carousel-shell' not in s:
                  s=s.replace('<div class="client-grid">','<div class="client-carousel-shell"><button class="client-arrow client-prev" type="button" aria-label="Previous clients">‹</button><div class="client-carousel-viewport"><div class="client-grid">',1)
                  s=s.replace('</div></div></section></main>','</div></div><button class="client-arrow client-next" type="button" aria-label="Next clients">›</button></div><div class="client-dots" aria-label="Client carousel pagination"></div></div></section></main>',1)
                  script='''<script>(function(){const section=document.querySelector('.client-section');if(!section)return;const track=section.querySelector('.client-grid'),cards=[...section.querySelectorAll('.client-card')],prev=section.querySelector('.client-prev'),next=section.querySelector('.client-next'),dots=section.querySelector('.client-dots');let page=0;function perPage(){return window.innerWidth<=700?1:2}function pages(){return Math.ceil(cards.length/perPage())}function renderDots(){dots.innerHTML='';for(let i=0;i<pages();i++){const b=document.createElement('button');b.type='button';b.className='client-dot'+(i===page?' active':'');b.setAttribute('aria-label','Go to client page '+(i+1));b.onclick=()=>go(i);dots.appendChild(b)}}function go(i){page=Math.max(0,Math.min(i,pages()-1));const idx=page*perPage();cards[idx].scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});renderDots()}prev.onclick=()=>go(page-1);next.onclick=()=>go(page+1);window.addEventListener('resize',()=>{page=0;renderDots()});renderDots()})();</script>'''
                  s=s.replace('</body>',script+'</body>')
              s=s.replace('../assets/custom-v12.css?v=14','../assets/custom-v12.css?v=15')
              p.write_text(s,encoding='utf-8')

          css=Path('assets/custom-v12.css')
          c=css.read_text(encoding='utf-8')
          marker='/* V15 client carousel */'
          if marker not in c:
              c+='''\n/* V15 client carousel */\n.client-section{background:#fff!important;padding-top:68px;padding-bottom:72px}.client-section .eyebrow{text-align:center}.client-section h3{text-align:center;font-size:32px;margin-bottom:10px;color:#17345d}.client-section .client-note{text-align:center;margin:0 auto 30px}.client-carousel-shell{position:relative;max-width:900px;margin:0 auto;padding:0 58px}.client-carousel-viewport{overflow:hidden}.client-grid{display:flex!important;gap:20px!important;margin-top:20px!important;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px}.client-grid::-webkit-scrollbar{display:none}.client-card{flex:0 0 calc(50% - 10px);min-height:210px!important;scroll-snap-align:start;background:#fff!important;border:2px solid #d9dfeb!important;border-radius:12px!important;box-shadow:none!important;padding:28px 24px!important;align-items:flex-start!important;justify-content:center!important}.client-card .stars{font-size:20px!important;letter-spacing:3px!important;margin-bottom:10px}.client-card .stars[aria-label*="4 out of 5"],.client-card .stars[aria-label*="4 من 5"]{font-size:0!important}.client-card .stars[aria-label*="4 out of 5"]::before,.client-card .stars[aria-label*="4 من 5"]::before{font-size:20px!important;letter-spacing:3px!important}.client-card .stars[aria-label*="4 out of 5"]::after,.client-card .stars[aria-label*="4 من 5"]::after{font-size:20px!important;color:#cfd3da!important;margin-inline-start:3px!important}.client-card b{font-size:18px!important;line-height:1.35!important;color:#17202c}.client-card span{font-size:13px!important;color:#77808d!important}.client-arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:#123d8d;color:#fff;font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(18,61,141,.18);z-index:3}.client-prev{left:4px}.client-next{right:4px}.client-dots{display:flex;justify-content:center;gap:7px;margin-top:26px}.client-dot{width:11px;height:11px;border:0;border-radius:50%;padding:0;background:#c7d9f7;cursor:pointer}.client-dot.active{background:#3b82f6}.client-arrow:hover{background:#0e3276}@media(max-width:700px){.client-carousel-shell{padding:0 48px}.client-card{flex-basis:100%;min-height:190px!important}.client-section h3{font-size:27px}.client-arrow{width:38px;height:38px}}\n'''
          css.write_text(c,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en/index.html ar/index.html assets/custom-v12.css
          git diff --cached --quiet || git commit -m "Redesign client section as testimonial carousel [skip ci]"
          git push
