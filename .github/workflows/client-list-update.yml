name: Update client list and ratings
on:
  push:
    paths:
      - '.github/workflows/client-list-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update client cards
        run: |
          python - <<'PY'
          from pathlib import Path

          en = Path('en/index.html')
          s = en.read_text(encoding='utf-8')
          s = s.replace('★★★★★', '★★★★')
          marker = '<div class="client-card"><div class="stars">★★★★</div><b>Tekanah</b><span>Housekeeping Services</span></div>'
          addition = marker + '<div class="client-card"><div class="stars">★★★★</div><b>Bahrya Restaurants</b><span>Restaurants</span></div><div class="client-card"><div class="stars">★★★★</div><b>Roken Al-Jamal</b><span>Retail</span></div><div class="client-card"><div class="stars">★★★★</div><b>Al Sawah Pharma</b><span>Pharmaceuticals</span></div><div class="client-card"><div class="stars">★★★★</div><b>Afaq Al Khaleejia Pharmaceuticals</b><span>Pharmaceuticals</span></div>'
          if 'Bahrya Restaurants' not in s:
              s = s.replace(marker, addition)
          en.write_text(s, encoding='utf-8')

          ar = Path('ar/index.html')
          s = ar.read_text(encoding='utf-8')
          s = s.replace('aria-label="تقييم 5 نجوم">★★★★★', 'aria-label="تقييم 4 نجوم">★★★★')
          marker = '<div class="client-card"><div class="stars" aria-label="تقييم 4 نجوم">★★★★</div><b>شركة تكانة لخدمات الهاوس كيبنج</b><span>خدمات الهاوس كيبنج</span></div>'
          addition = marker + '<div class="client-card"><div class="stars" aria-label="تقييم 4 نجوم">★★★★</div><b>شركة مطاعم بحرية</b><span>المطاعم</span></div><div class="client-card"><div class="stars" aria-label="تقييم 4 نجوم">★★★★</div><b>شركة ركن الجمال</b><span>التجزئة</span></div><div class="client-card"><div class="stars" aria-label="تقييم 4 نجوم">★★★★</div><b>شركة الصواح فارما</b><span>الأدوية</span></div><div class="client-card"><div class="stars" aria-label="تقييم 4 نجوم">★★★★</div><b>شركة أفق الخليجية للأدوية</b><span>الأدوية</span></div>'
          if 'شركة مطاعم بحرية' not in s:
              s = s.replace(marker, addition)
          ar.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "Ayman Esam Site Automation"
          git config user.email "actions@users.noreply.github.com"
          git add en/index.html ar/index.html
          git diff --cached --quiet || git commit -m "Add clients and change ratings to four stars [skip ci]"
          git push
