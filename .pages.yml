media:
  input: assets
  output: /assets

content:
  - name: about-en-settings
    label: About — English
    type: file
    path: content/about-en.json
    format: json
    fields:
      - name: hero_title
        label: Main title
        type: string
      - name: hero_intro
        label: Intro
        type: text
      - name: bio_primary
        label: Experience summary
        type: text
      - name: bio_secondary
        label: Objective
        type: text
      - name: quote
        label: Finance quote
        type: text
      - name: location
        label: Location
        type: string
      - name: current_scope
        label: Current scope
        type: text
      - name: core_focus
        label: Core focus
        type: text
      - name: events_intro
        label: Events introduction
        type: text
      - name: leap_year
        label: LEAP year
        type: string
      - name: seamless_year
        label: Seamless year
        type: string
  - name: about-ar-settings
    label: About — العربية
    type: file
    path: content/about-ar.json
    format: json
    fields:
      - name: hero_title
        label: العنوان الرئيسي
        type: string
      - name: hero_intro
        label: المقدمة
        type: text
      - name: bio_primary
        label: ملخص الخبرة
        type: text
      - name: bio_secondary
        label: الهدف المهني
        type: text
      - name: quote
        label: العبارة المالية
        type: text
      - name: location
        label: الموقع
        type: string
      - name: current_scope
        label: النطاق الحالي
        type: text
      - name: core_focus
        label: التركيز الأساسي
        type: text
      - name: events_intro
        label: مقدمة الفعاليات
        type: text
      - name: leap_year
        label: سنة LEAP
        type: string
      - name: seamless_year
        label: سنة Seamless
        type: string
  - name: insights-en
    label: Insights — English
    type: collection
    path: en/insights
    format: code
    subfolders: false
    view:
      layout: list
  - name: insights-ar
    label: Insights — العربية
    type: collection
    path: ar/insights
    format: code
    subfolders: false
    view:
      layout: list
  - name: robots
    label: robots.txt
    type: file
    path: robots.txt
    format: code
  - name: sitemap
    label: sitemap.xml
    type: file
    path: sitemap.xml
    format: code
