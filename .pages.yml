media:
  input: assets
  output: /assets

content:
  - name: home-en
    label: Home — English
    type: file
    path: content/home-en.json
    format: json
    fields:
      - {name: kicker, label: Kicker, type: string}
      - {name: name, label: Name, type: string}
      - {name: headline, label: Headline, type: text}
      - {name: intro, label: Introduction, type: text}
      - {name: metric_sales, label: Sales metric, type: string}
      - {name: metric_experience, label: Experience metric, type: string}
      - {name: metric_companies, label: Companies metric, type: string}
      - {name: metric_sectors, label: Sectors metric, type: string}
      - {name: about_title, label: About title, type: string}
      - {name: about_intro, label: About introduction, type: text}
      - {name: about_quote, label: About quote, type: text}
      - {name: industry_title, label: Industry title, type: string}
  - name: home-ar
    label: Home — العربية
    type: file
    path: content/home-ar.json
    format: json
    fields:
      - {name: kicker, label: العنوان الصغير, type: string}
      - {name: name, label: الاسم, type: string}
      - {name: headline, label: المسمى الرئيسي, type: text}
      - {name: intro, label: المقدمة, type: text}
      - {name: metric_sales, label: مؤشر المبيعات, type: string}
      - {name: metric_experience, label: مؤشر الخبرة, type: string}
      - {name: metric_companies, label: مؤشر الشركات, type: string}
      - {name: metric_sectors, label: مؤشر القطاعات, type: string}
      - {name: about_title, label: عنوان نبذة عني, type: string}
      - {name: about_intro, label: مقدمة نبذة عني, type: text}
      - {name: about_quote, label: العبارة, type: text}
      - {name: industry_title, label: عنوان القطاعات, type: string}

  - name: about-en
    label: About — English
    type: file
    path: content/about-en.json
    format: json
    fields:
      - {name: hero_title, label: Main title, type: string}
      - {name: hero_intro, label: Intro, type: text}
      - {name: bio_primary, label: Experience summary, type: text}
      - {name: bio_secondary, label: Objective, type: text}
      - {name: quote, label: Finance quote, type: text}
      - {name: location, label: Location, type: string}
      - {name: current_scope, label: Current scope, type: text}
      - {name: core_focus, label: Core focus, type: text}
      - {name: events_intro, label: Events introduction, type: text}
      - {name: leap_year, label: LEAP year, type: string}
      - {name: seamless_year, label: Seamless year, type: string}
  - name: about-ar
    label: About — العربية
    type: file
    path: content/about-ar.json
    format: json
    fields:
      - {name: hero_title, label: العنوان الرئيسي, type: string}
      - {name: hero_intro, label: المقدمة, type: text}
      - {name: bio_primary, label: ملخص الخبرة, type: text}
      - {name: bio_secondary, label: الهدف المهني, type: text}
      - {name: quote, label: العبارة المالية, type: text}
      - {name: location, label: الموقع, type: string}
      - {name: current_scope, label: النطاق الحالي, type: text}
      - {name: core_focus, label: التركيز الأساسي, type: text}
      - {name: events_intro, label: مقدمة الفعاليات, type: text}
      - {name: leap_year, label: سنة LEAP, type: string}
      - {name: seamless_year, label: سنة Seamless, type: string}

  - name: expertise-en
    label: Expertise — English
    type: file
    path: content/expertise-en.json
    format: json
    fields:
      - {name: hero_title, label: Main title, type: string}
      - {name: hero_intro, label: Introduction, type: text}
      - name: cards
        label: Expertise cards
        type: object
        list:
          min: 9
          max: 9
          collapsible: {collapsed: true, summary: "{title}"}
        fields:
          - {name: title, label: Title, type: string}
          - {name: description, label: Description, type: text}
  - name: expertise-ar
    label: Expertise — العربية
    type: file
    path: content/expertise-ar.json
    format: json
    fields:
      - {name: hero_title, label: العنوان الرئيسي, type: string}
      - {name: hero_intro, label: المقدمة, type: text}
      - name: cards
        label: بطاقات الخبرات
        type: object
        list:
          min: 9
          max: 9
          collapsible: {collapsed: true, summary: "{title}"}
        fields:
          - {name: title, label: العنوان, type: string}
          - {name: description, label: الوصف, type: text}

  - name: experience-en
    label: Experience — English
    type: file
    path: content/experience-en.json
    format: json
    fields:
      - {name: hero_title, label: Main title, type: string}
      - {name: hero_intro, label: Introduction, type: text}
      - name: jobs
        label: Roles
        type: object
        list:
          min: 6
          max: 6
          collapsible: {collapsed: true, summary: "{period} — {title}"}
        fields:
          - {name: period, label: Period, type: string}
          - {name: title, label: Job title, type: string}
          - {name: summary, label: Summary, type: text}
  - name: experience-ar
    label: Experience — العربية
    type: file
    path: content/experience-ar.json
    format: json
    fields:
      - {name: hero_title, label: العنوان الرئيسي, type: string}
      - {name: hero_intro, label: المقدمة, type: text}
      - name: jobs
        label: الوظائف
        type: object
        list:
          min: 6
          max: 6
          collapsible: {collapsed: true, summary: "{period} — {title}"}
        fields:
          - {name: period, label: الفترة, type: string}
          - {name: title, label: المسمى الوظيفي, type: string}
          - {name: summary, label: الوصف, type: text}

  - name: education-en
    label: Education — English
    type: file
    path: content/education-en.json
    format: json
    fields:
      - {name: hero_title, label: Main title, type: string}
      - {name: hero_intro, label: Introduction, type: text}
      - {name: degree, label: Degree, type: string}
      - {name: major, label: Major, type: string}
      - {name: university, label: University, type: string}
      - {name: graduation, label: Graduation year, type: string}
      - {name: quote, label: Education summary, type: text}
  - name: education-ar
    label: Education — العربية
    type: file
    path: content/education-ar.json
    format: json
    fields:
      - {name: hero_title, label: العنوان الرئيسي, type: string}
      - {name: hero_intro, label: المقدمة, type: text}
      - {name: degree, label: المؤهل, type: string}
      - {name: major, label: التخصص, type: string}
      - {name: university, label: الجامعة, type: string}
      - {name: graduation, label: سنة التخرج, type: string}
      - {name: quote, label: ملخص التعليم, type: text}

  - name: certifications-en
    label: Certifications — English
    type: file
    path: content/certifications-en.json
    format: json
    fields:
      - {name: hero_title, label: Main title, type: string}
      - {name: hero_intro, label: Introduction, type: text}
      - name: credentials
        label: Credentials
        type: object
        list:
          min: 3
          max: 3
          collapsible: {collapsed: true, summary: "{code} — {title}"}
        fields:
          - {name: code, label: Code, type: string}
          - {name: title, label: Title, type: string}
          - {name: description, label: Description, type: text}
      - {name: quote, label: Closing quote, type: text}
  - name: certifications-ar
    label: Certifications — العربية
    type: file
    path: content/certifications-ar.json
    format: json
    fields:
      - {name: hero_title, label: العنوان الرئيسي, type: string}
      - {name: hero_intro, label: المقدمة, type: text}
      - name: credentials
        label: المؤهلات
        type: object
        list:
          min: 3
          max: 3
          collapsible: {collapsed: true, summary: "{code} — {title}"}
        fields:
          - {name: code, label: الرمز, type: string}
          - {name: title, label: العنوان, type: string}
          - {name: description, label: الوصف, type: text}
      - {name: quote, label: العبارة الختامية, type: text}

  - name: insights-page-en
    label: Insights Page — English
    type: file
    path: content/insights-index-en.json
    format: json
    fields:
      - {name: hero_title, label: Main title, type: string}
      - {name: hero_intro, label: Introduction, type: text}
      - {name: author_title, label: Author section title, type: string}
      - {name: author_intro, label: Author introduction, type: text}
      - {name: quote, label: Closing quote, type: text}
      - {name: cta_title, label: CTA title, type: string}
      - {name: cta_text, label: CTA text, type: text}
  - name: insights-page-ar
    label: Insights Page — العربية
    type: file
    path: content/insights-index-ar.json
    format: json
    fields:
      - {name: hero_title, label: العنوان الرئيسي, type: string}
      - {name: hero_intro, label: المقدمة, type: text}
      - {name: author_title, label: عنوان قسم الكاتب, type: string}
      - {name: author_intro, label: مقدمة الكاتب, type: text}
      - {name: quote, label: العبارة الختامية, type: text}
      - {name: cta_title, label: عنوان الدعوة, type: string}
      - {name: cta_text, label: نص الدعوة, type: text}
  - name: insights-en
    label: Insight Articles — English
    type: collection
    path: content/insights-en
    format: json
    subfolders: false
    filename: "{slug}.json"
    operations: {create: true, rename: false, delete: false}
    fields:
      - {name: slug, label: Slug, type: string, required: true, pattern: "^[a-z0-9-]+$"}
      - {name: category, label: Category, type: string}
      - {name: title, label: Article title, type: string}
      - {name: image, label: Article image, type: image, required: true, options: {path: insights, extensions: [jpg, jpeg, png, webp], rename: safe}}
      - {name: meta, label: Reading / hero meta, type: text}
      - {name: description, label: SEO description, type: text}
      - name: body
        label: Article body
        type: rich-text
        options:
          format: html
          media: false
    view:
      primary: title
      search: [title, category]
      sort: [title]
  - name: insights-ar
    label: Insight Articles — العربية
    type: collection
    path: content/insights-ar
    format: json
    subfolders: false
    filename: "{slug}.json"
    operations: {create: true, rename: false, delete: false}
    fields:
      - {name: slug, label: الرابط, type: string, required: true, pattern: "^[a-z0-9-]+$"}
      - {name: category, label: التصنيف, type: string}
      - {name: title, label: عنوان المقال, type: string}
      - {name: image, label: صورة المقال, type: image, required: true, options: {path: insights, extensions: [jpg, jpeg, png, webp], rename: safe}}
      - {name: meta, label: معلومات القراءة, type: text}
      - {name: description, label: وصف SEO, type: text}
      - name: body
        label: محتوى المقال
        type: rich-text
        options:
          format: html
          media: false
    view:
      primary: title
      search: [title, category]
      sort: [title]

  - name: contact-en
    label: Contact — English
    type: file
    path: content/contact-en.json
    format: json
    fields:
      - {name: hero_title, label: Main title, type: string}
      - {name: hero_intro, label: Introduction, type: text}
      - {name: email, label: Email, type: string}
      - {name: mobile, label: Mobile, type: string}
      - {name: linkedin_label, label: LinkedIn label, type: string}
      - {name: linkedin_url, label: LinkedIn URL, type: string}
      - {name: location, label: Location, type: string}
  - name: contact-ar
    label: Contact — العربية
    type: file
    path: content/contact-ar.json
    format: json
    fields:
      - {name: hero_title, label: العنوان الرئيسي, type: string}
      - {name: hero_intro, label: المقدمة, type: text}
      - {name: email, label: البريد الإلكتروني, type: string}
      - {name: mobile, label: الجوال, type: string}
      - {name: linkedin_label, label: نص LinkedIn, type: string}
      - {name: linkedin_url, label: رابط LinkedIn, type: string}
      - {name: location, label: الموقع, type: string}

  - name: robots
    label: robots.txt
    type: file
    path: robots.txt
    format: code
    operations: {delete: false}
  - name: sitemap
    label: sitemap.xml
    type: file
    path: sitemap.xml
    format: code
    operations: {delete: false}
