media:
  input: assets
  output: /assets

content:
  - name: home-en
    label: Home — English
    type: file
    path: en/index.html
    format: code
  - name: home-ar
    label: Home — العربية
    type: file
    path: ar/index.html
    format: code

  - name: about-en-settings
    label: About — English
    type: file
    path: content/about-en.json
    format: json
    fields:
      - name: hero_title
        label: Main title
        type: string
      - name: hero_intro
        label: Intro
        type: text
      - name: bio_primary
        label: Experience summary
        type: text
      - name: bio_secondary
        label: Objective
        type: text
      - name: quote
        label: Finance quote
        type: text
      - name: location
        label: Location
        type: string
      - name: current_scope
        label: Current scope
        type: text
      - name: core_focus
        label: Core focus
        type: text
      - name: events_intro
        label: Events introduction
        type: text
      - name: leap_year
        label: LEAP year
        type: string
      - name: seamless_year
        label: Seamless year
        type: string
  - name: about-ar-settings
    label: About — العربية
    type: file
    path: content/about-ar.json
    format: json
    fields:
      - name: hero_title
        label: العنوان الرئيسي
        type: string
      - name: hero_intro
        label: المقدمة
        type: text
      - name: bio_primary
        label: ملخص الخبرة
        type: text
      - name: bio_secondary
        label: الهدف المهني
        type: text
      - name: quote
        label: العبارة المالية
        type: text
      - name: location
        label: الموقع
        type: string
      - name: current_scope
        label: النطاق الحالي
        type: text
      - name: core_focus
        label: التركيز الأساسي
        type: text
      - name: events_intro
        label: مقدمة الفعاليات
        type: text
      - name: leap_year
        label: سنة LEAP
        type: string
      - name: seamless_year
        label: سنة Seamless
        type: string

  - name: expertise-en
    label: Expertise — English
    type: file
    path: en/expertise.html
    format: code
  - name: expertise-ar
    label: Expertise — العربية
    type: file
    path: ar/expertise.html
    format: code

  - name: experience-en
    label: Experience — English
    type: file
    path: en/experience.html
    format: code
  - name: experience-ar
    label: Experience — العربية
    type: file
    path: ar/experience.html
    format: code

  - name: education-en
    label: Education — English
    type: file
    path: en/education.html
    format: code
  - name: education-ar
    label: Education — العربية
    type: file
    path: ar/education.html
    format: code

  - name: certifications-en
    label: Certifications — English
    type: file
    path: en/certifications.html
    format: code
  - name: certifications-ar
    label: Certifications — العربية
    type: file
    path: ar/certifications.html
    format: code

  - name: insights-index-en
    label: Insights Page — English
    type: file
    path: en/insights.html
    format: code
  - name: insights-index-ar
    label: Insights Page — العربية
    type: file
    path: ar/insights.html
    format: code
  - name: insights-en
    label: Insight Articles — English
    type: collection
    path: en/insights
    format: code
